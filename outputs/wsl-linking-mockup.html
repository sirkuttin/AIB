/* AIB teal (light): the same direction on warm paper. Teal stays saturated; status colours keep 3:1 as dots and 4.5:1 as text. */
/* ---- base element rules, copied from outputs/agent-studio/chat.css ---- */
:root { font-family: Segoe UI, system-ui, sans-serif; background: var(--bg); color: var(--text); font-size: 14px; }
* { box-sizing: border-box; }
button, input, textarea, select { font: inherit; }
button { border: 1px solid var(--line-control); background: var(--button-bg); color: var(--text); padding: 9px 14px; border-radius: 6px; cursor: pointer; }
button:hover { border-color: var(--accent); }
button:disabled { opacity: 0.5; cursor: default; }
.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); font-weight: 600; }
.primary:disabled { opacity: 1; background: var(--primary-disabled-bg); border-color: var(--primary-disabled-line); color: var(--on-accent-disabled); }
input, select, textarea { background: var(--bg-field); color: var(--text); border: 1px solid var(--line-field); border-radius: 6px; padding: 11px; min-width: 0; }
input::placeholder { color: var(--text-faint); }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 2px; }
[hidden] { display: none !important; }
aside { background: var(--panel); border-right: 1px solid var(--line); overflow: auto; }
/* ---- settings.css, copied from outputs/agent-studio/settings.css ---- */
/* Settings page: covers the chat area only (the chat list stays visible). */
main {
  position: relative;
}
.side-settings {
  display: flex;
  align-items: center;
  gap: 8px;
  flex: none;
  width: 100%;
  height: 30px;
  margin: 0;
  padding: 0 12px;
  border: 0;
  border-top: 1px solid var(--line);
  border-radius: 0;
  background: transparent;
  color: var(--muted);
  font-size: 13px;
  text-align: left;
}
.side-settings:hover,
.side-settings:focus-visible {
  background: var(--side-settings-bg);
  color: var(--text);
}
.side-settings span:nth-child(2) {
  flex: 1;
}
.side-settings kbd {
  font:
    12px Consolas,
    monospace;
  border: 1px solid var(--line-control);
  border-bottom-width: 2px;
  border-radius: 4px;
  padding: 0 4px;
  color: var(--kbd-text-2);
  background: var(--bg-inset);
}
body.settings-open .side-settings {
  color: var(--link);
}

/* The page covers the chat column and the Activity column; the chat list stays. It is zoomed with the rest of the interface
   (textsize.css, Interface size), so its left edge, already the scaled --side-w, is divided by that zoom, and it keeps no
   Activity margin: the settings get the whole width instead of being squeezed between the panels. */
.st-page {
  position: absolute;
  inset: 0 0 0 var(--side-w, 240px);
  margin-right: 0 !important;
  z-index: 40;
  display: flex;
  background: var(--bg);
  color: var(--text);
  min-height: 0;
  container-type: inline-size;
}
html[data-ui-scaled] .st-page {
  left: calc(var(--side-w, 240px) / var(--ui-scale, 1));
}
.st-page[hidden] {
  display: none;
}
@media (max-width: 1100px) {
  .st-page,
  html[data-ui-scaled] .st-page {
    left: 0;
  }
}
.st-frame {
  flex: 1;
  min-width: 0;
  min-height: 0;
  display: grid;
  grid-template-columns: 220px minmax(0, 1fr);
}
.st-nav {
  display: flex;
  flex-direction: column;
  gap: 10px;
  min-height: 0;
  overflow: auto;
  padding: 18px 12px;
  border-right: 1px solid var(--line);
  background: var(--bg-inset);
}
.st-search {
  width: 100%;
  padding: 8px 10px;
  font-size: 13px;
}
.st-sections {
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.st-section {
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: 100%;
  margin: 0;
  padding: 8px 10px;
  border: 0;
  border-radius: 6px;
  background: transparent;
  color: var(--text-3);
  font-size: 13px;
  text-align: left;
}
.st-section:hover {
  background: var(--side-settings-bg);
}
.st-section.active {
  background: var(--st-section-active-bg);
  color: var(--text-bright);
  box-shadow: inset 3px 0 0 var(--accent);
}
.st-section.empty {
  opacity: 0.45;
}
.st-section:focus-visible,
.st-close:focus-visible {
  outline: 2px solid var(--focus-ring);
  outline-offset: 1px;
}
.st-count {
  font-size: 11px;
  color: var(--muted);
  background: var(--bg-field);
  border-radius: 9px;
  padding: 0 7px;
}
.st-main {
  display: flex;
  flex-direction: column;
  min-width: 0;
  min-height: 0;
}
.st-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 16px 28px 10px;
  border-bottom: 1px solid var(--line);
}
.st-head h2 {
  margin: 0;
  font-size: 18px;
}
.st-close {
  margin: 0;
  width: 32px;
  height: 32px;
  padding: 0;
  font-size: 20px;
  line-height: 1;
  background: transparent;
  border-color: transparent;
  color: var(--muted);
}
.st-close:hover {
  background: var(--button-bg);
  color: var(--text-bright);
}
.st-content {
  flex: 1;
  min-height: 0;
  overflow: auto;
  padding: 18px 28px 40px;
  max-width: 860px;
  width: 100%;
}
.st-card {
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--bg-row);
  padding: 14px 16px;
  margin: 0 0 14px;
}
.st-card-title {
  margin: 0 0 8px;
  font-size: 14px;
}
.st-group {
  margin: 18px 0 8px;
  font-size: 11px;
  letter-spacing: 1.2px;
  text-transform: uppercase;
  color: var(--muted);
  font-weight: 600;
}
.st-note {
  margin: 6px 0;
  font-size: 12px;
  line-height: 1.5;
  color: var(--muted);
  overflow-wrap: anywhere;
}
.st-note.bad,
.st-error,
.st-hint.warn {
  color: var(--st-note-bad-text);
}
.st-hint.warn {
  color: var(--st-hint-warn-text);
}
.st-note.dim {
  opacity: 0.8;
}
.st-error {
  margin: 8px 0 0;
  font-size: 12px;
}
.st-agent {
  border: 1px solid var(--st-agent-line);
  border-radius: 8px;
  background: var(--select-option-bg);
  padding: 10px 12px;
  margin: 0 0 10px;
}
.st-agent.off {
  opacity: 0.65;
}
.st-agent-head {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}
.st-letter {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 22px;
  height: 22px;
  border-radius: 5px;
  background: var(--st-letter-bg);
  color: var(--chip-icon-text);
  font-size: 12px;
  font-weight: 600;
}
.st-tag {
  font-size: 11px;
  color: var(--muted);
}
.st-status {
  margin-left: auto;
  font-size: 12px;
  font-weight: 600;
  border-radius: 9px;
  padding: 2px 8px;
  border: 1px solid var(--line-control);
}
.st-status.dim {
  color: var(--status-idle);
  background: var(--chip-idle-bg);
  border-color: var(--chip-idle-line);
}
.st-status.ok {
  color: var(--st-status-ok-text);
  background: var(--chip-done-bg);
  border-color: var(--st-status-ok-line);
}
.st-status.bad {
  color: var(--st-note-bad-text);
  border-color: var(--st-status-bad-line);
}
.st-status.warn {
  color: var(--st-status-warn-text);
  background: var(--chip-needs-bg);
  border-color: var(--st-status-warn-line);
}
.st-command {
  display: block;
  margin: 6px 0 0;
  font:
    12px Consolas,
    monospace;
  color: var(--st-command-text);
  overflow-wrap: anywhere;
  white-space: pre-wrap;
}
.st-actions {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  margin-top: 10px;
}
.st-actions button,
.st-card > button,
.st-facts + button {
  margin: 0;
  padding: 6px 12px;
  font-size: 12px;
}
.st-danger {
  color: var(--st-note-bad-text);
}
.st-toggle {
  display: inline-flex;
  flex-direction: row;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  cursor: pointer;
}
.st-toggle input {
  margin: 0;
  padding: 0;
  width: 16px;
  height: 16px;
  flex: none;
  accent-color: var(--accent);
}
.st-form {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-top: 12px;
  padding-top: 12px;
  border-top: 1px dashed var(--line);
}
.st-field {
  display: flex;
  flex-direction: column;
  gap: 4px;
  font-size: 12px;
}
.st-field .st-label {
  color: var(--text-3);
}
.st-field input,
.st-field textarea,
.st-field select {
  width: 100%;
  max-width: none;
  padding: 8px 10px;
  font-size: 13px;
  font-family: inherit;
}
.st-field textarea {
  display: block;
  resize: vertical;
  font-family: Consolas, monospace;
  font-size: 12px;
}
.st-env-row {
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) auto;
  padding: 4px 0;
  border-top: 0;
}
.st-env-rows {
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.st-hint {
  font-size: 11px;
  color: var(--muted);
  line-height: 1.45;
}
.st-form .primary,
.st-add {
  width: auto;
  margin: 0;
}
.st-line {
  display: grid;
  grid-template-columns: minmax(90px, 150px) minmax(0, 1fr) minmax(0, 1fr) auto;
  gap: 10px;
  align-items: end;
  padding: 10px 0;
  border-top: 1px solid var(--st-line);
}
.st-line:first-of-type {
  border-top: 0;
}
.st-line-name {
  align-self: center;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.st-line button {
  margin: 0;
  padding: 6px 10px;
  font-size: 12px;
}
.st-add-project {
  margin-top: 10px;
  max-width: 320px;
  width: 100%;
  padding: 8px;
}
.st-keys {
  list-style: none;
  margin: 0 0 6px;
  padding: 0;
}
.st-keys li {
  display: flex;
  justify-content: space-between;
  gap: 16px;
  padding: 6px 0;
  border-bottom: 1px solid var(--st-line);
  font-size: 13px;
}
.st-kbd {
  display: inline-flex;
  flex-wrap: wrap;
  gap: 4px;
  align-items: center;
  color: var(--muted);
}
.st-kbd kbd {
  font:
    11px Consolas,
    monospace;
  border: 1px solid var(--line-control);
  border-bottom-width: 2px;
  border-radius: 4px;
  padding: 1px 6px;
  color: var(--kbd-text-2);
  background: var(--bg-inset);
}
.st-facts {
  display: grid;
  grid-template-columns: max-content minmax(0, 1fr);
  gap: 6px 18px;
  margin: 0 0 10px;
  font-size: 12px;
}
.st-facts dt {
  color: var(--muted);
}
.st-facts dd {
  margin: 0;
  overflow-wrap: anywhere;
  font-family: Consolas, monospace;
}
/* Label on the left, its control beside it, like the other sections (the page's plain `label` rule is a centred column). */
.st-notify .notify-row {
  display: flex;
  flex-direction: row;
  justify-content: flex-start;
  align-items: center;
  text-align: left;
  gap: 12px;
  margin: 8px 0;
  font-size: 13px;
}
.st-notify .notify-row > span {
  flex: 0 1 260px;
}
.st-notify select {
  max-width: 240px;
}
.st-notify .notify-muted {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  margin: 4px 0;
}
.st-notify .notify-muted button,
.st-notify > button {
  margin: 6px 0 0;
  padding: 5px 10px;
  font-size: 12px;
}
.st-notify .note {
  margin: 6px 0;
  font-size: 12px;
  color: var(--muted);
}
.st-notify .note.warn {
  color: var(--st-hint-warn-text);
}
.st-flash {
  position: fixed;
  right: 24px;
  bottom: 20px;
  background: var(--st-section-active-bg);
  border: 1px solid var(--accent);
  border-radius: 8px;
  padding: 8px 14px;
  font-size: 12px;
}
@media (max-width: 900px) {
  .st-frame {
    grid-template-columns: 1fr;
    grid-template-rows: auto minmax(0, 1fr);
  }
  .st-nav {
    flex-direction: column;
    border-right: 0;
    border-bottom: 1px solid var(--line);
    padding: 10px 12px;
  }
  .st-sections {
    flex-direction: row;
    flex-wrap: wrap;
  }
  .st-section {
    width: auto;
  }
  .st-content {
    padding: 14px 16px 30px;
  }
  .st-line {
    grid-template-columns: 1fr 1fr;
  }
  .st-line-name {
    grid-column: 1/-1;
  }
}
.st-agent-head button {
  margin: 0;
  padding: 6px 12px;
  font-size: 12px;
}
.st-agent-head .st-primary {
  padding: 6px 14px;
  border: 0;
  border-radius: 6px;
  background: var(--accent);
  color: var(--st-primary-text);
  font-weight: 600;
}
.st-agent-head .st-primary:hover {
  background: var(--accent-wash-2);
  color: var(--text-bright);
}
/* An Install that cannot run yet (a prerequisite is missing): the app's disabled primary (chat.css .primary:disabled), a solid
   teal wash with readable text, not the half-transparent default. */
.st-agent-head .st-primary:disabled,
.st-agent-head .st-primary:disabled:hover {
  opacity: 1;
  background: var(--primary-disabled-bg);
  box-shadow: inset 0 0 0 1px var(--primary-disabled-line);
  color: var(--on-accent-disabled);
  cursor: default;
}
.st-agent-head .st-cancel {
  margin-left: auto;
}
.st-progress {
  height: 6px;
  margin: 10px 0 0;
  border-radius: 3px;
  background: var(--hover);
  overflow: hidden;
}
.st-progress-bar {
  height: 6px;
  background: var(--accent);
  transition: width 0.4s ease;
}
.st-note .st-link,
.st-agent-head .st-link,
.st-beta-install .st-link,
.st-beta-term-head .st-link,
.st-beta-key .st-link {
  margin: 0 0 0 4px;
  padding: 0;
  border: 0;
  background: none;
  color: var(--link);
  font-size: 12px;
  text-decoration: underline;
  cursor: pointer;
}

.st-radios {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin: 8px 0;
}
.st-radios .st-radio {
  margin: 0;
}
/* Theme picker: a grid of choices, each with a small preview painted in that theme's own tokens (data-theme on .st-swatch). */
.st-themes {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
  gap: 8px;
  margin: 8px 0;
}
.st-theme-group {
  grid-column: 1 / -1;
  margin: 8px 0 0;
  font-size: 12px;
  font-weight: 600;
  color: var(--muted);
}
.st-theme {
  display: flex;
  flex-direction: row;
  align-items: center;
  margin: 0;
  color: var(--text);
  gap: 8px;
  padding: 6px 8px;
  border: 1px solid var(--line);
  border-radius: 6px;
  cursor: pointer;
}
.st-theme:hover {
  background: var(--hover);
}
.st-theme:has(input:checked) {
  border-color: var(--accent);
  background: var(--accent-wash);
}
.st-theme:has(input:focus-visible) {
  outline: 2px solid var(--focus-ring);
  outline-offset: 1px;
}
.st-theme input {
  margin: 0;
}
.st-theme-name {
  font-size: 13px;
}
.st-swatch-pair {
  display: inline-flex;
  flex: none;
}
.st-swatch-pair .st-swatch {
  width: 26px;
}
.st-swatch-pair .st-swatch-side {
  display: none;
}
.st-swatch {
  display: inline-flex;
  flex: none;
  width: 52px;
  height: 34px;
  overflow: hidden;
  border: 1px solid var(--line-strong);
  border-radius: 4px;
  background: var(--bg);
}
.st-swatch-side {
  display: flex;
  flex-direction: column;
  gap: 3px;
  width: 16px;
  padding: 4px 2px;
  background: var(--panel);
}
.st-swatch-row {
  height: 4px;
  border-radius: 2px;
  background: var(--line-strong);
}
.st-swatch-row.sel {
  background: var(--accent-wash);
  box-shadow: inset 2px 0 0 var(--sel-bar);
}
.st-swatch-main {
  display: flex;
  flex: 1;
  flex-direction: column;
  gap: 3px;
  padding: 4px;
}
.st-swatch-line {
  height: 3px;
  border-radius: 2px;
  background: var(--text);
}
.st-swatch-line.short {
  width: 60%;
  background: var(--muted);
}
.st-swatch-dots {
  display: flex;
  gap: 2px;
}
.st-swatch-dot {
  width: 5px;
  height: 5px;
  border-radius: 50%;
}
.st-swatch-dot.working {
  background: var(--status-working);
}
.st-swatch-dot.needs {
  background: var(--status-needs);
}
.st-swatch-dot.done {
  background: var(--status-done);
}
.st-swatch-btn {
  width: 14px;
  height: 5px;
  margin-top: auto;
  border-radius: 2px;
  background: var(--accent);
}
/* Updates card (updates-ui.js): its buttons sit apart, in the settings' own button size. */
.st-updates .st-row {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin: 8px 0;
}
.st-updates .st-row button {
  margin: 0;
  padding: 6px 12px;
  font-size: 12px;
}
/* Too narrow for the section list beside the settings (a big Interface size in a small window): the list goes above them, as
   one wrapping row. Last in the file, so it wins over the rules above. */
@container (max-width: 640px) {
  .st-frame {
    grid-template-columns: minmax(0, 1fr);
    grid-template-rows: auto minmax(0, 1fr);
  }
  .st-nav {
    border-right: 0;
    border-bottom: 1px solid var(--line);
    padding: 10px 12px;
    max-height: calc(40vh / var(--ui-scale, 1));
  }
  .st-sections {
    flex-direction: row;
    flex-wrap: wrap;
  }
  .st-section {
    width: auto;
    gap: 6px;
  }
  .st-content {
    padding: 14px 16px 32px;
  }
  .st-head {
    padding: 12px 16px 8px;
  }
}

/* ---- Beta agents (settings-ui.js renderAgentsBeta): the card's lead line, each agent's cost line, the install command when the
   agent is missing, the API key box, and the sign-in terminal panel (ACP terminal auth; an xterm from terminal-ui.js runSignin). */
.st-beta-lead {
  margin: 0 0 10px;
}
.st-beta-cost {
  margin: 4px 0 0;
  font-size: 11px;
  color: var(--muted);
}
.st-beta-install {
  margin: 6px 0 0;
  font-size: 12px;
}
.st-beta-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  margin: 2px 0;
}
.st-beta-row button {
  margin: 0;
  padding: 6px 12px;
  font-size: 12px;
  flex: 0 0 auto;
}
.st-beta-command .st-command {
  margin: 2px 0 0;
  user-select: all;
}
.st-beta-docs,
.st-beta-keylink {
  font-size: 12px;
}
.st-beta-keylink {
  align-self: flex-start;
}
/* Links that start their own line sit on the same left edge as the hint lines and commands (no leading 4px). A Copy that wraps
   inside a command row starts at the row's edge too: the row's gap spaces it otherwise. */
.st-beta-key .st-beta-keylink,
.st-beta-install .st-beta-docs,
.st-beta-row .st-link {
  margin-left: 0;
}
/* "Install uv first": its own line under the card's header, so Install and the status badge keep their place. */
.st-beta-blocked {
  margin: 4px 0 0;
}
.st-beta-needs {
  margin: 6px 0 0;
  font-size: 12px;
}
.st-beta-needs-list {
  margin: 2px 0 0;
  padding: 0 0 0 18px;
}
.st-beta-need {
  margin: 2px 0;
}
.st-beta-need.bad .st-beta-need-text {
  font-weight: 600;
}
.st-beta-blocked {
  font-size: 12px;
}
.st-beta-key {
  margin: 8px 0 0;
}
.st-beta-url {
  display: flex;
  flex-direction: column;
  gap: 4px;
  margin: 8px 0 0;
}
.st-beta-url .st-label {
  color: var(--text-3);
}
.st-beta-key .st-beta-row input {
  min-width: 220px;
  flex: 1 1 220px;
}
.st-beta-term {
  margin: 8px 0 0;
  border: 1px solid var(--st-agent-line);
  border-radius: 6px;
  overflow: hidden;
}
.st-beta-term-head {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 4px 8px;
  font-size: 12px;
  color: var(--muted);
}
.st-beta-term-title {
  flex: 1 1 auto;
  overflow-wrap: anywhere;
  font:
    12px Consolas,
    monospace;
}
.st-beta-term-view {
  height: 220px;
  background: var(--term-bg);
  padding: 4px;
}
.st-beta-term > .st-note {
  margin: 4px 8px 6px;
}

/* Settings > Remote control (devices-ui.js): phone access, the four setup steps, pairing and the paired phones. */
.dv-sub {
  margin: 14px 0 6px;
  font-size: 13px;
}
.dv-off {
  opacity: 0.6;
  cursor: default;
}
.dv-checks {
  margin: 10px 0 0;
  padding: 0;
  list-style: none;
}
.dv-checks li {
  margin: 0 0 10px;
}
.dv-check-head {
  display: flex;
  align-items: baseline;
  gap: 8px;
  font-size: 13px;
}
.dv-checks li > .st-note,
.dv-checks li > .st-actions {
  margin-left: 22px;
}
.dv-mark {
  width: 14px;
  flex: none;
  text-align: center;
  color: var(--muted);
}
.dv-checks li.ok .dv-mark {
  color: var(--st-status-ok-text);
}
.dv-command {
  flex: 1 1 260px;
  margin: 0;
}
.dv-approve,
.dv-pair {
  margin: 0 0 14px;
  padding: 12px 14px;
  border: 1px solid var(--line-control);
  border-radius: 8px;
  background: var(--select-option-bg);
}
.dv-approve {
  border-color: var(--st-status-warn-line);
}
.dv-check-words {
  font-size: 15px;
}
.dv-scopes {
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin: 8px 0;
}
/* the page's plain label rule adds 18 px above and below: switches sit close together */
.dv-scopes .st-toggle {
  margin: 0;
}
/* a paired phone's switches: one wrapping line under its name */
.dv-device .dv-scopes {
  flex-direction: row;
  flex-wrap: wrap;
  gap: 6px 18px;
}
/* Start new chats: a child of Send, on its own line indented under it (greyed out while Send is off) */
.dv-child-row {
  flex-basis: 100%;
  padding-left: 24px;
}
.dv-child-row .st-toggle {
  margin: 0;
}
.dv-child-row .st-toggle:has(input:disabled) {
  opacity: 0.55;
}
.dv-child-note {
  margin: 2px 0 0;
}
.dv-pair-grid {
  display: flex;
  flex-wrap: wrap;
  gap: 16px;
  align-items: flex-start;
}
.dv-qr {
  width: 176px;
  height: 176px;
  flex: none;
  border-radius: 6px;
  image-rendering: pixelated;
}
.dv-pair-side {
  flex: 1 1 220px;
  min-width: 0;
}
.dv-words {
  margin: 0 0 6px;
  font-size: 18px;
  font-weight: 600;
  overflow-wrap: anywhere;
}
.dv-phone-steps {
  margin: 4px 0 0;
  padding-left: 18px;
  font-size: 12px;
  color: var(--muted);
}
.dv-list {
  margin: 0 0 4px;
}
.dv-activity {
  max-height: 240px;
  overflow: auto;
  margin: 10px 0 0;
  padding: 6px 10px;
  border: 1px solid var(--line);
  border-radius: 8px;
}
/* The "Open" link of a checklist step: an external link that looks like the neighbouring buttons. */
.dv-checks .dv-open {
  display: inline-block;
  padding: 6px 12px;
  border: 1px solid var(--line-control);
  border-radius: 6px;
  background: var(--button-bg);
  color: var(--text);
  font-size: 12px;
  text-decoration: none;
}
.dv-checks .dv-open:hover {
  border-color: var(--accent);
}

/* Remote control's setup steps: a number (a check when done, ! on an error), the step's notes, progress, confirm and buttons
   indented under its title; a step that comes later shows its title only, dimmed. */
.dv-steps li.later > .dv-check-head {
  opacity: 0.6;
}
.dv-steps li.err .dv-mark {
  color: var(--st-note-bad-text);
}
.dv-steps li.now .dv-mark,
.dv-steps li.wait .dv-mark {
  color: var(--accent);
}
.dv-checks li > .dv-progress,
.dv-checks li > .dv-confirm,
.dv-checks li > .dv-details,
.dv-checks li > .dv-term {
  margin-left: 22px;
}
.dv-progress {
  margin: 6px 0;
  padding: 0;
  list-style: none;
  font-size: 12px;
  color: var(--muted);
}
.dv-checks .dv-progress li {
  margin: 0 0 4px;
}
.dv-progress li.now {
  color: var(--text);
}
.dv-confirm {
  padding: 8px 10px;
  border: 1px solid var(--st-status-warn-line);
  border-radius: 6px;
  color: var(--text);
}
.dv-details {
  max-height: 180px;
  overflow: auto;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  font-size: 11px;
}
.dv-steps .dv-open {
  align-self: center;
  font-size: 12px;
}
.dv-good {
  color: var(--st-status-ok-text);
}
.dv-changes {
  margin: 12px 0 0;
}
.dv-changes summary {
  cursor: pointer;
  font-size: 12px;
  color: var(--muted);
}
.dv-changes .st-command {
  display: block;
  overflow-wrap: anywhere;
  white-space: pre-wrap;
}
.dv-remind {
  margin: 4px 0 8px;
}
.dv-remind .st-toggle {
  margin: 0;
}

/* ---- mockup frame only (not part of the design) ---- */
body { margin: 0; height: 100vh; display: grid; grid-template-rows: auto minmax(0, 1fr); }
.mk-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 6px 12px; background: var(--bg-inset); border-bottom: 1px dashed var(--line-strong); font-size: 12px; color: var(--muted); }
.mk-bar button { padding: 4px 10px; font-size: 12px; }
.mk-bar button.on { border-color: var(--accent); color: var(--text-bright); background: var(--accent-wash); }
.mk-app { display: grid; grid-template-columns: 240px minmax(0, 1fr); min-height: 0; }
.mk-app aside { display: flex; flex-direction: column; padding: 0; }
.mk-side-top { flex: 1; padding: 18px 14px; font-size: 13px; color: var(--muted); }
.mk-side-top .mk-brand { color: var(--heading-tint-text); font-size: 18px; margin: 0 0 16px; }
.mk-side-top .mk-proj { padding: 6px 8px; border-radius: 6px; }
.mk-side-top .mk-badge { font-size: 10px; margin-left: 6px; padding: 0 5px; border: 1px solid var(--line-control); border-radius: 4px; }
main { position: relative; min-height: 0; --side-w: 0px; }
/* ---- NEW for this section (proposed additions to settings.css) ---- */
.wl-lead { margin: 0 0 10px; }
.wl-distro .st-tag { margin-left: 2px; }
.wl-facts { margin: 4px 0 8px; }
.wl-checks { margin: 4px 0 0; }
.wl-checks li { margin: 0 0 8px; }
.wl-checks .dv-check-head { font-size: 13px; }
.wl-checks .wl-state { margin-left: auto; font-size: 12px; color: var(--muted); }
.wl-checks li.bad .dv-mark, .wl-checks li.bad .wl-state { color: var(--st-note-bad-text); }
.wl-checks li.ok .wl-state { color: var(--st-status-ok-text); }
.wl-checks li.opt .dv-mark { color: var(--muted); }
.wl-checks li > .st-beta-row, .wl-checks li > .st-command { margin-left: 22px; }
.wl-limits { margin: 6px 0 0; font-size: 12px; color: var(--muted); }
.wl-limits b { color: var(--text); font-weight: 600; }
.wl-usage { display: grid; grid-template-columns: max-content max-content; gap: 4px 18px; margin: 4px 0 10px; font-size: 12px; }
.wl-usage dt { color: var(--muted); }
.wl-usage dd { margin: 0; font-family: Consolas, monospace; text-align: right; }
.wl-foot { margin: 10px 0 0; }
.wl-term-line { color: var(--term-fg); font: 12px Consolas, monospace; white-space: pre; margin: 0; padding: 2px 4px; }
</style>

<body>
<div class="mk-bar" role="toolbar" aria-label="Mockup state">
  <span>Mockup state (not part of the design):</span>
  <span id="mkStates"></span>
</div>
<div class="mk-app">
  <aside>
    <div class="mk-side-top">
      <p class="mk-brand">AIB</p>
      <div class="mk-proj">app <span class="mk-badge">Ubuntu</span></div>
      <div class="mk-proj">api <span class="mk-badge">Ubuntu</span></div>
      <div class="mk-proj">site</div>
    </div>
    <button class="side-settings" type="button"><span>⚙</span><span>Settings</span><kbd>Ctrl+,</kbd></button>
  </aside>
  <main>
    <section class="st-page" role="dialog" aria-label="Settings">
      <div class="st-frame">
        <nav class="st-nav" aria-label="Settings sections">
          <input class="st-search" type="search" placeholder="Search settings" aria-label="Search settings">
          <div class="st-sections" id="mkNav"></div>
        </nav>
        <div class="st-main">
          <header class="st-head"><h2>AIB Linking (WSL)</h2><button class="st-close" type="button" aria-label="Close settings">×</button></header>
          <div class="st-content" id="mkContent"></div>
        </div>
      </div>
    </section>
  </main>
</div>
<script>
(function () {
  'use strict';
  var el = function (tag, text, cls) {
    var n = document.createElement(tag);
    if (text != null && text !== '') n.textContent = String(text);
    if (cls) n.className = cls;
    return n;
  };
  var add = function (parent) {
    for (var i = 1; i < arguments.length; i++) if (arguments[i]) parent.append(arguments[i]);
    return parent;
  };
  var button = function (text, cls, disabled, title) {
    var b = el('button', text, cls || '');
    b.type = 'button';
    if (disabled) b.disabled = true;
    if (title) b.title = title;
    return b;
  };
  var note = function (text, cls) { return el('p', text, 'st-note' + (cls ? ' ' + cls : '')); };
  var card = function (title, note0) {
    var c = el('section', null, 'st-card');
    c.append(el('h3', title, 'st-card-title'));
    if (note0) c.append(note(note0));
    return c;
  };
  var status = function (text, cls) { return el('span', text, 'st-status ' + cls); };
  var code = function (text) { return el('code', text, 'st-command'); };
  var copyRow = function (cmd, extra) {
    var row = el('div', null, 'st-beta-row st-beta-command');
    row.append(code(cmd), button('Copy', 'st-link'));
    if (extra) row.append(extra);
    return row;
  };
  var facts = function (rows) {
    var dl = el('dl', null, 'st-facts wl-facts');
    rows.forEach(function (r) { dl.append(el('dt', r[0]), el('dd', r[1])); });
    return dl;
  };
  var actions = function () {
    var a = el('div', null, 'st-actions');
    for (var i = 0; i < arguments.length; i++) if (arguments[i]) a.append(arguments[i]);
    return a;
  };

  var SECTIONS = ['AIB Linking', 'AIB Linking (WSL)', 'Defaults', 'Notifications', 'Remote control', 'Allow rules', 'Editors', 'Keyboard', 'Appearance', 'AIB server'];
  var nav = document.getElementById('mkNav');
  SECTIONS.forEach(function (s) {
    var b = el('button', null, 'st-section' + (s === 'AIB Linking (WSL)' ? ' active' : ''));
    b.type = 'button';
    b.append(el('span', s));
    if (s === 'AIB Linking (WSL)') b.setAttribute('aria-current', 'page');
    nav.append(b);
  });

  var LEAD = 'Run Claude Code, Codex and the other ACP agents inside your WSL distros, next to your Windows agents, all on this PC. AIB installs them into its own folder in each distro (~/.aib-server), with the versions it reviewed.';
  var KEEP = 'A distro keeps running while a WSL project is open or a WSL chat works, also after you quit AIB. When nothing works, AIB lets go and WSL stops it by its own rules.';
  var BETA_NOTE = "These connect the same way but haven't been tested by us yet. Tell us what breaks.";
  var NVM = 'curl -fsSLo "$t" https://raw.githubusercontent.com/nvm-sh/nvm/v0.41.0/install.sh && echo "<sha256>  $t" | sha256sum -c && bash "$t" && . "$HOME/.nvm/nvm.sh" && nvm install --lts';

  // ---- one distro's state for a mockup state -----------------------------------------------------------------------
  function ubuntu(over) {
    var d = {
      name: 'Ubuntu', letter: 'U', linux: 'Ubuntu 24.04.4 LTS · x86_64', isDefault: true, state: 'ready',
      helper: '0.1.0-beta.10', folder: '1.4 GB', home: '/home/kirk',
      node: { state: 'ok', text: 'Node.js 24.22.1 with npm 11.6' },
      git: 'ok', curl: 'ok', free: '803 GB free',
      claudeCmd: '2.1.302 (your own install)', codexCmd: '0.166.0 (your own install)',
      claude: { kind: 'ready', version: '0.102.0', by: 'aib', signin: 'Ready' },
      codex: { kind: 'ready', version: '2.6.0', by: 'aib', signin: 'Ready' },
      omp: { kind: 'missing' },
    };
    for (var k in over || {}) d[k] = over[k];
    return d;
  }

  // ---- cards -------------------------------------------------------------------------------------------------------
  function overview(distros, extra) {
    var c = card('WSL on this PC');
    c.append(note(LEAD, 'wl-lead'));
    distros.concat(extra || []).forEach(function (d) {
      var row = el('div', null, 'st-agent wl-distro');
      var head = el('div', null, 'st-agent-head');
      head.append(el('span', d.letter, 'st-letter'), el('strong', d.name));
      head.append(el('span', d.tag || ('WSL 2 · ' + d.linux.split(' · ')[0].replace(' LTS', '') + (d.isDefault ? ' · WSL default' : '')), 'st-tag'));
      var st = { ready: ['Ready', 'ok'], off: ['Not running', 'dim'], stopped: ['Stopped', 'bad'], starting: ['Starting', 'warn'], unsupported: ['Not supported', 'dim'] }[d.state];
      head.append(status(st[0], st[1]));
      row.append(head);
      if (d.why) row.append(note(d.why, 'dim'));
      c.append(row);
    });
    c.append(note(KEEP));
    return c;
  }

  function distroCard(d) {
    var c = card(d.name);
    if (d.state === 'ready') {
      c.append(facts([
        ['State', 'Ready'],
        ['Linux', d.linux],
        ['AIB helper', d.helper + ' · checked'],
        ['AIB folder', '~/.aib-server · ' + d.folder],
        ['Home', d.home],
      ]));
      c.append(actions(button('Open ' + d.name + ' terminal'), button('Repair AIB helper', '', false, 'Check the AIB programs in ' + d.name + ' against their checksums and copy them again')));
    } else if (d.state === 'stopped') {
      c.append(facts([['State', 'Stopped'], ['Linux', d.linux], ['AIB helper', d.helper + ' (not running)']]));
      c.append(note(d.name + ' stopped (Windows restart or wsl --shutdown). Chats in ' + d.name + ' stopped with it; their history is kept.', 'bad'));
      c.append(actions(button('Reconnect', 'primary', false, 'Start ' + d.name + ' and connect AIB to it again')));
    } else if (d.state === 'off') {
      c.append(facts([['State', 'Not running'], ['Linux', d.linux]]));
      c.append(note(d.name + ' is not running. AIB starts it when a WSL project needs it. Its checklist and agents show once it runs.'));
      c.append(actions(button('Start ' + d.name + ' and check', 'primary')));
    }
    return c;
  }

  function check(cls, mark, title, state, extra) {
    var li = el('li', null, cls);
    var head = el('div', null, 'dv-check-head');
    head.append(el('span', mark, 'dv-mark'), el('span', title), el('span', state, 'wl-state'));
    li.append(head);
    (extra || []).forEach(function (n) { li.append(n); });
    return li;
  }

  function needsCard(d) {
    var c = card('What ' + d.name + ' needs', 'AIB looks in ' + d.name + "'s login shell, the way your terminal there sees it.");
    var ul = el('ul', null, 'dv-checks wl-checks');
    if (d.node.state === 'ok') ul.append(check('ok', '✓', 'Node.js 22 or newer, with npm', d.node.text));
    else {
      ul.append(check('bad', '!', 'Node.js 22 or newer, with npm', d.node.text, [
        note('Needed to install Claude Code, Codex and the npm Beta agents in ' + d.name + '. Install runs nvm, the way nodejs.org offers it for Linux, in a terminal here. It adds nvm to your home folder and shell start-up file; it needs no password.'),
        copyRow(NVM),
        actions(button('Install Node.js 24 (LTS) in ' + d.name, 'primary'), button('Open ' + d.name + ' terminal'), button('Check again', 'st-link')),
      ]));
    }
    ul.append(check('ok', '✓', 'curl', 'found'));
    if (d.git === 'ok') ul.append(check('ok', '✓', 'git', 'found 2.43.0'));
    else ul.append(check('bad', '!', 'git', 'missing', [note('Needed for a chat\'s own copy, Changes and Merge. Until then chats work in the project folder. It needs your password, so run it yourself:'), copyRow('sudo apt install git'), actions(button('Open ' + d.name + ' terminal'), button('Check again', 'st-link'))]));
    ul.append(check('ok', '✓', 'Free space in your home folder', d.free));
    var cmdNote = function (agent, cmd, docs) {
      return [note('Not needed for AIB chats: AIB\'s ' + agent + ' includes it. Install the ' + cmd + ' command only to use ' + agent + ' in your own terminal.', 'dim'), docs ? copyRow(docs) : null].filter(Boolean);
    };
    if (d.claudeCmd) ul.append(check('opt ok', '✓', 'claude command (optional)', d.claudeCmd));
    else ul.append(check('opt', '–', 'claude command (optional)', 'not installed', cmdNote('Claude Code', 'claude', 'curl -fsSL https://claude.ai/install.sh | bash')));
    if (d.codexCmd) ul.append(check('opt ok', '✓', 'codex command (optional)', d.codexCmd));
    else ul.append(check('opt', '–', 'codex command (optional)', 'not installed', cmdNote('Codex', 'codex', 'npm install -g @openai/codex')));
    c.append(ul);
    return c;
  }

  function agentRow(d, id, a) {
    var NAMES = { claude: ['Claude Code', 'C', '0.102.0', 'about 420 MB', 'node ~/.aib-server/agents/claude/', '/node_modules/@agentclientprotocol/claude-agent-acp/dist/index.js'], codex: ['Codex', 'X', '2.6.0', 'about 300 MB', 'node ~/.aib-server/agents/codex/', '/node_modules/@agentclientprotocol/codex-acp/dist/index.js'], omp: ['OMP', 'O'] };
    var n = NAMES[id];
    var row = el('div', null, 'st-agent');
    var head = el('div', null, 'st-agent-head');
    head.append(el('span', n[1], 'st-letter'), el('strong', n[0]));
    if (a.by === 'aib') head.append(el('span', 'Installed by AIB', 'st-tag'));
    else if (a.by === 'own') head.append(el('span', 'Your own install', 'st-tag'));
    row.append(head);
    var nodeMissing = d.node.state !== 'ok';
    if (a.kind === 'missing' && id === 'omp') {
      head.append(status('Not installed', 'warn'));
      row.append(note('AIB does not install OMP. Install it in ' + d.name + ' as its docs say, then choose Check again.', 'dim'));
      row.append(actions(toggle(true), button('Open ' + d.name + ' terminal'), button('Check again', 'st-link')));
      return row;
    }
    if (a.kind === 'missing') {
      head.append(status('Not installed', 'warn'));
      var go = button(a.failed ? 'Retry' : 'Install in ' + d.name, 'st-primary', nodeMissing, nodeMissing ? 'Needs Node.js in ' + d.name + ' first' : 'AIB installs ' + n[0] + ' ' + n[2] + ' into its own folder in ' + d.name + ' (~/.aib-server/agents), with the versions AIB reviewed. Nothing else in ' + d.name + ' changes.');
      head.append(go);
      if (nodeMissing) {
        row.append(note('Install Node.js first', 'dim st-beta-blocked'));
        var needs = el('div', null, 'st-beta-needs');
        needs.append(el('span', 'Needs first:', 'st-hint'));
        var ul = el('ul', null, 'st-beta-needs-list');
        var li = el('li', null, 'st-beta-need bad');
        li.append(el('span', 'Node.js 22 or newer: missing', 'st-beta-need-text'), ' ', button('Install Node.js 24 (LTS)', 'st-link'));
        ul.append(li);
        needs.append(ul);
        row.append(needs);
      } else if (a.failed) {
        row.append(note(a.failed, 'bad'));
      } else {
        row.append(note('One click: AIB installs ' + n[0] + ' ' + n[2] + ' (' + n[3] + ') into ~/.aib-server. It comes with ' + n[0] + '\'s own program, so nothing else is needed in ' + d.name + '.'));
      }
      var how = el('div', null, 'st-beta-install');
      how.append(el('span', 'Or install it yourself in ' + d.name + ':', 'st-hint'), copyRow(id === 'claude' ? 'npm i -g @agentclientprotocol/claude-agent-acp' : 'npm i -g @agentclientprotocol/codex-acp'));
      row.append(how);
      row.append(actions(toggle(true), button('Open ' + d.name + ' terminal')));
      return row;
    }
    if (a.kind === 'installing') {
      head.append(button('Cancel', 'st-cancel'));
      var bar = el('div', null, 'st-progress');
      bar.setAttribute('role', 'progressbar');
      bar.setAttribute('aria-valuenow', String(a.percent));
      var fill = el('div', null, 'st-progress-bar');
      fill.style.width = a.percent + '%';
      bar.append(fill);
      row.append(bar, note('Installing ' + n[0] + ' in ' + d.name + '… Downloading and unpacking… about 40 seconds. It goes on if you close Settings or restart AIB.'));
      row.append(actions(toggle(true)));
      return row;
    }
    // found
    head.append(status(a.signin, a.signin === 'Ready' ? 'ok' : 'warn'));
    if (a.signin === 'Needs sign-in') head.append(button('Sign in', 'st-primary'));
    head.append(button('Check again', 'st-link'));
    if (a.update) head.append(button('Update in ' + d.name, 'st-primary'));
    row.append(el('span', 'Launcher', 'st-hint'), code(a.by === 'aib' ? n[4] + a.version + n[5] : a.launcher));
    if (a.update) row.append(note('AIB now uses ' + n[0] + ' ' + n[2] + '; ' + d.name + ' has ' + a.version + '. The old copy keeps working until the new one is complete; chats that use it keep it until they end.'));
    if (id === 'codex' && a.signin === 'Ready') {
      var lim = el('p', null, 'wl-limits');
      lim.append('Usage limits of ' + d.name + '\'s Codex sign-in: ', el('b', '5 h 32% used'), ' · ', el('b', 'week 10% used'), ' (4 min ago). Same ChatGPT account as on Windows means the same limits.');
      row.append(lim);
    }
    if (a.signin === 'Needs sign-in') row.append(note('Sign in runs ' + n[0] + '\'s own sign-in in a ' + d.name + ' terminal here; its page opens in your Windows browser. ' + d.name + ' signs in separately from Windows. AIB does not see your password or sign-in details.'));
    row.append(actions(toggle(true), a.by === 'aib' ? button('Uninstall', 'st-danger', false, 'Delete the copy AIB installed in ' + d.name + '. Your sign-in stays.') : null));
    return row;
  }
  function toggle(on) {
    var l = el('label', null, 'st-toggle'), cb = el('input');
    cb.type = 'checkbox';
    cb.checked = on;
    l.append(cb, el('span', on ? 'On' : 'Off'));
    return l;
  }

  function agentsCard(d) {
    var c = card('Agents in ' + d.name);
    c.append(agentRow(d, 'claude', d.claude), agentRow(d, 'codex', d.codex), agentRow(d, 'omp', d.omp));
    var f = note('"Found" means the program exists in ' + d.name + '. Sign-in state comes from a quick status check AIB runs in ' + d.name + ' when Settings opens and after an install or sign-in. Your Windows agents are in ', 'wl-foot');
    f.append(button('AIB Linking', 'st-link'), '.');
    c.append(f);
    return c;
  }

  function betaCard(d) {
    var c = card('Beta agents in ' + d.name);
    c.append(note(BETA_NOTE, 'st-beta-lead'));
    var rows = [
      ['G', 'GitHub Copilot CLI', 'Needs a GitHub Copilot plan (the Free plan works)', 'npm install -g @github/copilot', 'npm'],
      ['Q', 'Qwen Code', "Free CLI · model use is billed by your API key's provider", 'npm install -g @qwen-code/qwen-code', 'npm'],
      ['C', 'Cursor CLI', 'Paid plan', 'curl https://cursor.com/install -fsS | bash', 'terminal'],
    ];
    rows.forEach(function (r) {
      var row = el('div', null, 'st-agent off');
      var head = el('div', null, 'st-agent-head');
      head.append(el('span', r[0], 'st-letter'), el('strong', r[1]), status('Not installed', 'warn'), button('Install', 'st-primary', d.node.state !== 'ok' && r[4] === 'npm'));
      row.append(head, el('p', r[2], 'st-beta-cost'));
      var how = el('div', null, 'st-beta-install');
      how.append(el('span', r[4] === 'npm' ? 'Or install it yourself in ' + d.name + ':' : 'Install runs this in a terminal here, in ' + d.name + ' (it installs into ~/.local/bin):', 'st-hint'), copyRow(r[3]));
      row.append(how, actions(toggle(false)));
      c.append(row);
    });
    c.append(actions(button('Show all 10 Beta agents')));
    return c;
  }

  function aibCard(d, refused) {
    var c = card('AIB in ' + d.name);
    c.append(note('What AIB keeps in ' + d.name + ', all in ~/.aib-server. Your projects, ~/.claude, ~/.codex and anything you installed yourself are not in it.'));
    var dl = el('dl', null, 'wl-usage');
    [['AIB programs (keeper, helper)', '190 MB'], d.claude.version ? ['Claude Code ' + d.claude.version, '425 MB'] : null, d.codex.version ? ['Codex ' + d.codex.version, '457 MB'] : null, d.claude.version ? ['npm download cache', '210 MB'] : null, ['Chat copies of this AIB (3)', '96 MB'], ['In all', d.folder]].filter(Boolean).forEach(function (r) {
      dl.append(el('dt', r[0]), el('dd', r[1]));
    });
    c.append(dl);
    if (refused) c.append(note('2 chat copies in ' + d.name + ' have changes that are not committed: app · Fix login, api · Add tests. Merge or discard them first.', 'bad'));
    c.append(actions(button('Remove AIB from ' + d.name, 'st-danger', false, 'Stops AIB\'s helper in ' + d.name + ' and deletes ~/.aib-server. The next WSL project sets AIB up again.')));
    return c;
  }

  function group(d, refused) {
    var out = [el('h4', d.name, 'st-group'), distroCard(d)];
    if (d.state !== 'ready') return out;
    return out.concat([needsCard(d), agentsCard(d), betaCard(d), aibCard(d, refused)]);
  }

  var DOCKER = { name: 'docker-desktop', letter: 'D', tag: 'WSL 2', state: 'unsupported', why: "docker-desktop is Docker's own distro; AIB cannot run there.", linux: '' };

  var STATES = {
    good: { label: 'All good', make: function () { var u = ubuntu(); return [overview([u], [DOCKER])].concat(group(u)); } },
    node: { label: 'Missing Node.js', make: function () {
      var u = ubuntu({ node: { state: 'bad', text: 'missing' }, claudeCmd: '', codexCmd: '', claude: { kind: 'missing' }, codex: { kind: 'missing' }, folder: '290 MB' });
      return [overview([u])].concat(group(u)); } },
    claude: { label: 'Missing claude CLI', make: function () {
      var u = ubuntu({ claudeCmd: '', codexCmd: '', claude: { kind: 'missing' } });
      return [overview([u])].concat(group(u)); } },
    installing: { label: 'Installing', make: function () {
      var u = ubuntu({ claudeCmd: '', claude: { kind: 'installing', percent: 46 } });
      return [overview([u])].concat(group(u)); } },
    update: { label: 'Update available', make: function () {
      var u = ubuntu({ claude: { kind: 'ready', version: '0.98.1', by: 'aib', signin: 'Ready', update: true }, codex: { kind: 'ready', version: '2.6.0', by: 'aib', signin: 'Needs sign-in' } });
      return [overview([u])].concat(group(u)); } },
    error: { label: 'Error', make: function () {
      var u = ubuntu({ codex: { kind: 'missing', failed: 'The install failed: npm could not reach registry.npmjs.org (ETIMEDOUT). Check the network in Ubuntu, then Retry. Nothing was left behind.' }, git: 'bad' });
      return [overview([u])].concat(group(u, true)); } },
    stopped: { label: 'Distro stopped', make: function () {
      var u = ubuntu({ state: 'stopped' });
      return [overview([u])].concat(group(u)); } },
    nowsl: { label: 'No WSL on this PC', make: function () {
      var c = card('WSL on this PC');
      c.append(note('WSL is not installed on this PC. With it, AIB runs agents in Linux on this PC, in projects inside a distro, next to your Windows agents. Install it in an administrator PowerShell, then restart Windows:'));
      c.append(copyRow('wsl --install'));
      var links = el('div', null, 'st-actions');
      var a = el('a', 'How to install WSL (Microsoft)', 'st-link st-beta-docs');
      a.href = 'https://learn.microsoft.com/windows/wsl/install';
      links.append(a, button('Check again', 'st-link'));
      c.append(links);
      return [c]; } },
    two: { label: 'Two distros', make: function () {
      var u = ubuntu();
      var deb = { name: 'Debian', letter: 'D', linux: 'Debian 12 · x86_64', isDefault: false, state: 'off' };
      var w1 = { name: 'Ubuntu-20.04', letter: 'U', tag: 'WSL 1', state: 'unsupported', why: 'Ubuntu-20.04 runs on WSL 1. AIB needs WSL 2. Convert it in PowerShell (takes a few minutes; back it up first): wsl --set-version Ubuntu-20.04 2', linux: '' };
      return [overview([u, deb], [w1, DOCKER])].concat(group(u), group(deb)); } },
  };

  var content = document.getElementById('mkContent');
  var bar = document.getElementById('mkStates');
  function show(id) {
    content.replaceChildren.apply(content, STATES[id].make());
    Array.prototype.forEach.call(bar.children, function (b) { b.classList.toggle('on', b.dataset.state === id); });
  }
  Object.keys(STATES).forEach(function (id) {
    var b = button(STATES[id].label);
    b.dataset.state = id;
    b.addEventListener('click', function () { show(id); });
    bar.append(b);
  });
  show('good');
})();
</script>
</body>
</html>
